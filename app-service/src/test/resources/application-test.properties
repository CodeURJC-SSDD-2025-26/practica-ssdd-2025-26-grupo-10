# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_UPPER=FALSE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable SSL for tests if needed (though H2 doesn't care)
server.ssl.enabled=false

# Override other properties for test speed
spring.mustache.check-template-location=false

# JWT Security Properties for Testing
security.jwt.secret-key=YXZlcnlsb25nYW5kY29tcGxleHNlY3JldGtleXRoYXRuZWVkc3RvYmVhdGxlYXN0MjU2Yml0c2xvbmcxMjM0NTY3ODkw
security.jwt.expiration=86400000

# Disable SQL Initializer for tests
spring.sql.init.mode=never
