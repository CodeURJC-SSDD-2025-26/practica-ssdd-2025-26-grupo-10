      type: object
      description: Detailed breakdown of the environmental impact for a material quantity
      properties:
        quantity:
          type: number
          format: double
          description: Input quantity of material
          example: 500.0
        category:
          type: string
          description: Input waste category
          example: METAL_WASTE
        co2SavedKg:
          type: number
          format: double
          description: Calculated CO2 reduction in Kg
          example: 225.0
        unit:
          type: string
          description: Measurement unit for the saved impact
          example: Kg
    CompanyImpactDTO:
      type: object
      description: Aggregated sustainability metrics for a specific company
      properties:
        totalCo2Saved:
          type: number
          format: double
          description: Total CO2 savings accumulated across all completed agreements
          example: 1250.5
        totalMaterialsManaged:
          type: number
          format: double
          description: Total quantity of waste material reintroduced into the circular
            economy
          example: 5000.0
        unit:
          type: string
          description: The unit used for material weight (usually kg)
          example: kg
