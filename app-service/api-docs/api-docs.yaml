          type: string
          minLength: 1
        taxId:
          type: string
          minLength: 1
        contactEmail:
          type: string
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 4
        address:
          type: string
          minLength: 1
        phone:
          type: string
        industrialSector:
          type: string
        description:
          type: string
      required:
