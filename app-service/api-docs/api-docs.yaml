components:
  schemas:
    CompanyDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        commercialName:
          type: string
          minLength: 1
        contactEmail:
          type: string
          minLength: 1
        taxId:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        industrialSector:
          type: string
          minLength: 1
        description:
          type: string
          maxLength: 255
          minLength: 0
        password:
          type: string
          writeOnly: true
        role:
          type: string
        co2Saved:
          type: number
          format: double
        ranking:
          type: integer
          format: int32
        sector:
          type: string
        verified:
          type: boolean
        formattedCo2Saved:
          type: string
        initial:
          type: string
      required:
      - address
      - commercialName
      - contactEmail
      - description
      - industrialSector
      - phone
      - taxId
    OfferDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        wasteCategory:
          type: string
          minLength: 1
        quantity:
          type: number
          format: double
        unit:
          type: string
          minLength: 1
        price:
          type: number
          format: double
        availability:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - ACTIVE
          - RESERVED
          - PAUSED
          - IN_NEGOTIATION
          - FINISHED
          - REPORTED
        publicationDate:
          type: string
          format: date-time
        visits:
          type: integer
          format: int32
        company:
          $ref: "#/components/schemas/CompanyDTO"
        owned:
          type: boolean
        formattedQuantity:
          type: string
        formattedWasteType:
          type: string
        formattedPublicationDate:
          type: string
        formattedPrice:
          type: string
        category:
          type: string
        closed:
          type: boolean
      required:
      - availability
      - description
      - price
      - quantity
      - title
      - unit
      - wasteCategory
    DemandDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
        wasteCategory:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        quantity:
          type: number
          format: double
        unit:
          type: string
          minLength: 1
        urgency:
          type: string
        maxBudget:
          type: number
          format: double
        pickupZone:
          type: string
        validity:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - CLOSED
        createdAt:
          type: string
          format: date-time
        publicationDate:
          type: string
          format: date-time
        expiryDate:
          type: string
          format: date-time
        visits:
          type: integer
          format: int32
        company:
          $ref: "#/components/schemas/CompanyDTO"
        owned:
          type: boolean
        formattedQuantity:
          type: string
        formattedWasteType:
          type: string
        formattedPickupZone:
          type: string
        formattedPublicationDate:
          type: string
        daysRemaining:
          type: integer
          format: int64
        formattedBudget:
          type: string
        formattedValidity:
          type: string
        expired:
          type: boolean
      required:
      - description
      - maxBudget
      - quantity
      - title
      - unit
      - wasteCategory
    GlobalConfigDTO:
      type: object
      description: Structured representation of active platform parameters and business
        constants
      properties:
        platformName:
          type: string
          description: The official name of the platform
          example: EcoMóstoles B2B
        contactEmail:
          type: string
          description: Public contact email for support
          example: soporte@ecomostoles.es
        platformCity:
          type: string
          description: The city where the platform is physically established
          example: Móstoles
        platformCommission:
          type: string
          description: The current platform commission percentage applied to agreements
          example: 5.0
        categoryList:
          type: string
          description: Comma-separated list of allowed waste categories
        unitList:
          type: string
          description: Comma-separated list of allowed measurement units
        availabilityList:
          type: string
          description: Comma-separated list of allowed availability/urgency statuses
        sectorList:
          type: string
          description: Comma-separated list of industrial sectors for company profiles
    AgreementDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        exchangedMaterial:
          type: string
        quantity:
          type: number
          format: double
        unit:
          type: string
        agreedPrice:
          type: number
          format: double
        pickupDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - COMPLETED
          - ACCEPTED
          - REJECTED
        notes:
          type: string
        registrationDate:
          type: string
          format: date-time
        originCompany:
          $ref: "#/components/schemas/CompanyDTO"
        destinationCompany:
          $ref: "#/components/schemas/CompanyDTO"
        offerId:
          type: integer
          format: int64
        demandId:
          type: integer
          format: int64
        platformCommission:
          type: number
          format: double
        co2Impact:
          type: number
          format: double
        formattedAgreedPrice:
          type: string
        formattedQuantity:
          type: string
        formattedPlatformCommission:
          type: string
        deletable:
          type: boolean
        formattedCo2Impact:
          type: string
        formattedRegistrationDate:
          type: string
    AuthRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    AuthResponse:
      type: object
      properties:
