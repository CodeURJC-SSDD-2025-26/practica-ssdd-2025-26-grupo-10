                    <li class="mb-2"><a href="mailto:soporte@ecomostoles.com" class="text-muted text-decoration-none text-hover-success"><i class="fas fa-envelope me-2"></i>soporte@ecomostoles.com</a></li>
                </ul>
            </div>
        </div>
        <div class="row align-items-center border-top pt-4">
            <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
