            </div>
            <div class="col-md-6 text-center text-md-end">
                <a href="https://linkedin.com/company/ecomostoles" class="text-secondary me-3 text-decoration-none" target="_blank"><i class="fab fa-linkedin fs-5"></i></a>
                <a href="https://x.com/ecomostoles" class="text-secondary me-3 text-decoration-none" target="_blank">
