openapi: 3.1.0
info:
  title: EcoMóstoles B2B API
  description: API REST para el intercambio de residuos
  version: "1.0"
servers:
- url: https://localhost:8443
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Demands
  description: Full CRUD for material exchange demands
- name: Smart Matching
  description: Algorithmic matching system to pair demands with optimal supply
- name: Sustainability
  description: Environmental impact calculations
- name: Authentication
  description: Endpoints for user registration and JWT token issuance
- name: Messages
  description: Asynchronous messaging between tenants
- name: Dashboard
  description: Analytical data exports for charting libraries
- name: Companies
  description: CRUD operations for corporate tenant management
- name: Images
  description: Endpoints for downloading and uploading images and logos
- name: Agreements
  description: Management of B2B commercial agreements
- name: Offers
  description: Full CRUD for material exchange offers
paths:
  /api/v1/offers/{id}:
    get:
      tags:
      - Offers
      summary: Get offer by ID
      description: Retrieves the complete detail of a single material exchange offer.
        Returns 404 if the offer does not exist.
      operationId: getOfferById
      parameters:
      - name: id
        in: path
        description: Database primary key of the offer
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Offer found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferDTO"
        "404":
          description: Offer not found
        "500":
          description: Unexpected server error
    put:
      tags:
      - Offers
      summary: Update an existing offer
      description: "Replaces the editable fields of an offer. Company ownership, visit\
        \ count and publication date are preserved. Returns 404 if the offer does\
        \ not exist."
      operationId: updateOffer
      parameters:
      - name: id
        in: path
        description: Database primary key of the offer to update
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        description: "New offer values (company, visits and publicationDate are ignored)"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferDTO"
        required: true
      responses:
        "200":
          description: Offer updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferDTO"
        "400":
          description: Validation failed -- check request body
        "404":
          description: Offer not found
        "500":
          description: Unexpected server error
    delete:
      tags:
      - Offers
      summary: Delete an offer
      description: Permanently removes an offer from the platform. Returns 204 NO
        CONTENT on success. Returns 404 if the offer does not exist.
      operationId: deleteOffer
      parameters:
      - name: id
        in: path
        description: Database primary key of the offer to delete
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: Offer deleted successfully
        "404":
          description: Offer not found
        "500":
          description: Unexpected server error
  /api/v1/demands/{id}:
    get:
      tags:
      - Demands
      summary: Get demand by ID
      description: Retrieves the complete detail of a single material exchange demand.
        Returns 404 if the demand does not exist.
      operationId: getDemandById
      parameters:
      - name: id
        in: path
        description: Database primary key of the demand
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Demand found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DemandDTO"
        "404":
          description: Demand not found
        "500":
          description: Unexpected server error
    put:
      tags:
      - Demands
      summary: Update an existing demand
      description: "Replaces the editable fields of a demand. Company ownership, visit\
        \ count and publication dates are preserved. Returns 404 if the demand does\
        \ not exist."
      operationId: updateDemand
      parameters:
      - name: id
        in: path
        description: Database primary key of the demand to update
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        description: "New demand values (company, visits and publicationDate are ignored)"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemandDTO"
        required: true
      responses:
        "200":
          description: Demand updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DemandDTO"
        "400":
          description: Validation failed -- check request body
        "404":
          description: Demand not found
        "500":
          description: Unexpected server error
    delete:
      tags:
      - Demands
      summary: Delete a demand
      description: Permanently removes a demand from the platform. Returns 204 NO
        CONTENT on success. Returns 400 if the demand cannot be deleted (e.g. has
        associated agreements). Returns 404 if the demand does not exist.
      operationId: deleteDemand
      parameters:
      - name: id
        in: path
        description: Database primary key of the demand to delete
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: Demand deleted successfully
        "400":
          description: Cannot delete due to existing constraints
        "404":
          description: Demand not found
        "500":
          description: Unexpected server error
  /api/v1/companies/{id}:
    get:
      tags:
      - Companies
      summary: Get company by ID
      description: Retrieves the public-safe profile of a single company. Returns
        404 if the company does not exist.
      operationId: getCompanyById
      parameters:
      - name: id
        in: path
        description: Database primary key of the company
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Company found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyDTO"
        "404":
          description: Company not found
        "500":
          description: Unexpected server error
    put:
      tags:
      - Companies
      summary: Update a company
      description: "Applies changes to the public-editable fields of an existing company.\
        \ Sensitive fields (password hash, logo, role list) are immutable via this\
        \ endpoint."
      operationId: updateCompany
      parameters:
      - name: id
        in: path
        description: Database primary key of the company to update
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        description: Fields to update (only public-safe fields are applied)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyDTO"
        required: true
      responses:
        "200":
          description: Company updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyDTO"
        "400":
          description: Validation failed — check request body
        "404":
          description: Company not found
        "500":
          description: Unexpected server error
    delete:
      tags:
      - Companies
      summary: Delete a company
      description: Permanently removes a company from the system. Returns 204 NO CONTENT
        on success. Returns 404 if the company does not exist.
      operationId: deleteCompany
      parameters:
      - name: id
        in: path
        description: Database primary key of the company to delete
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: Company deleted successfully
        "404":
          description: Company not found
        "500":
          description: Unexpected server error
  /api/v1/agreements/{id}:
    get:
      tags:
      - Agreements
      summary: Get agreement by ID
      description: Retrieves the detail of a single agreement.
      operationId: getAgreementById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Agreement found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgreementDTO"
        "404":
          description: Agreement not found
        "500":
          description: Unexpected server error
    put:
      tags:
      - Agreements
      summary: Update an agreement
      description: "Updates fields or changes the state of an agreement (e.g., to\
        \ COMPLETED)."
      operationId: updateAgreement
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgreementDTO"
        required: true
      responses:
        "200":
          description: Agreement updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgreementDTO"
        "400":
          description: Validation failed
        "404":
          description: Agreement not found
    delete:
      tags:
      - Agreements
      summary: Delete an agreement
      description: "Cancels or deletes an agreement, if allowed."
      operationId: deleteAgreement
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Agreement deleted successfully
        "400":
          description: Cannot delete agreement in its current state
        "404":
          description: Agreement not found
  /api/v1/agreements/{id}/status:
    put:
      tags:
      - Agreements
      summary: Update agreement status
      description: Updates only the status of an existing agreement.
      operationId: updateAgreementStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
        required: true
      responses:
        "200":
          description: Status updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgreementDTO"
        "404":
          description: Agreement not found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgreementDTO"
  /api/v1/offers:
    get:
      tags:
      - Offers
      summary: "List offers (paginated, optional keyword filter)"
      description: Returns a paginated list of material exchange offers. Provide `keyword`
        to filter by title or description (ACTIVE offers only). Omit `keyword` to
        retrieve all offers across all statuses.
      operationId: getAllOffers
      parameters:
      - name: keyword
        in: query
        description: Optional free-text keyword to search by title or description
          (returns only ACTIVE offers when provided)
        required: false
        schema:
          type: string
        example: plastico
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 12
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "publicationDate,DESC"
          items:
            type: string
      responses:
        "200":
          description: Page of offers returned successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferSummary"
        "500":
          description: Unexpected server error
    post:
      tags:
      - Offers
      summary: Create a new offer
      description: "Publishes a new material exchange offer. Returns 201 CREATED with\
        \ a Location header pointing to the new resource. Fields 'id', 'publicationDate'\
        \ and 'visits' are set server-side."
      operationId: createOffer
      requestBody:
        description: "Offer data to publish (id, publicationDate and visits are ignored)"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferDTO"
        required: true
      responses:
        "201":
          description: Offer created successfully -- see Location header
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OfferDTO"
        "400":
          description: Validation failed -- check request body
        "500":
          description: Unexpected server error
  /api/v1/messages:
    get:
      tags:
      - Messages
      summary: List all messages
      description: Returns a list of all messages in the system (ordered by send date
        desc).
      operationId: getAllMessages
      responses:
        "200":
          description: List of messages returned successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageDTO"
        "500":
          description: Unexpected server error
    post:
      tags:
      - Messages
      summary: Send a new message
      description: Delivers a new message from one tenant to another.
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageDTO"
        required: true
      responses:
        "201":
          description: Message sent successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageDTO"
        "400":
          description: Validation failed
        "404":
          description: Sender or Recipient not found
  /api/v1/images/offers/{id}:
    get:
      tags:
      - Images
      summary: Get offer image
      description: Retrieves the image binary data for a specific offer.
      operationId: getOfferImage
      parameters:
      - name: id
        in: path
        description: ID of the offer
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Image returned successfully
          content:
            image/jpeg: {}
        "404":
          description: Offer or image not found
    post:
      tags:
      - Images
      summary: Upload offer image
      description: Uploads and saves a new image for a specific offer.
      operationId: uploadOfferImage
      parameters:
      - name: id
        in: path
        description: ID of the offer
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageFile:
                  type: string
                  format: binary
                  description: Image file to upload
              required:
              - imageFile
      responses:
        "204":
          description: Image uploaded successfully
        "400":
          description: Invalid file or empty upload
        "404":
          description: Offer not found
  /api/v1/images/companies/{id}:
    get:
      tags:
      - Images
      summary: Get company logo
      description: Retrieves the logo binary data for a specific company.
      operationId: getCompanyLogo
      parameters:
      - name: id
        in: path
        description: ID of the company
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Logo returned successfully
          content:
            image/jpeg: {}
        "404":
          description: Company or logo not found
    post:
      tags:
      - Images
      summary: Upload company logo
      description: Uploads and saves a new logo for a specific company.
      operationId: uploadCompanyLogo
      parameters:
      - name: id
        in: path
        description: ID of the company
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imageFile:
                  type: string
                  format: binary
                  description: Logo file to upload
              required:
              - imageFile
      responses:
        "204":
          description: Logo uploaded successfully
        "400":
          description: Invalid file or empty upload
        "404":
          description: Company not found
  /api/v1/demands:
    get:
      tags:
      - Demands
      summary: "List demands (paginated, optional keyword filter)"
      description: Returns a paginated list of material exchange demands. Provide
        `keyword` to filter by title or description (ACTIVE demands only). Omit `keyword`
        to retrieve all demands across all statuses.
      operationId: getAllDemands
      parameters:
      - name: keyword
        in: query
        description: Optional free-text keyword to search by title or description
          (returns only ACTIVE demands when provided)
        required: false
        schema:
          type: string
        example: madera
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 12
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "publicationDate,DESC"
          items:
            type: string
      responses:
        "200":
          description: Page of demands returned successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DemandDTO"
        "500":
          description: Unexpected server error
    post:
      tags:
      - Demands
      summary: Create a new demand
      description: "Publishes a new material exchange demand. Returns 201 CREATED\
        \ with a Location header pointing to the new resource. Fields 'id', 'publicationDate',\
        \ 'expiryDate', 'createdAt' and 'visits' are set server-side."
      operationId: createDemand
      requestBody:
        description: Demand data to publish (server-side fields are ignored)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemandDTO"
        required: true
      responses:
        "201":
          description: Demand created successfully -- see Location header
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DemandDTO"
        "400":
          description: Validation failed -- check request body
        "500":
          description: Unexpected server error
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new company
      description: Creates a new company record and returns a valid JWT token for
        immediate access.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate and get token
      description: Validates credentials against the database and returns a JWT token
        for accessing secured API endpoints.
      operationId: authenticate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/agreements:
    get:
      tags:
      - Agreements
      summary: List agreements
      description: Returns a paginated list of commercial agreements.
      operationId: getAllAgreements
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 12
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "registrationDate,DESC"
          items:
            type: string
      responses:
        "200":
          description: Page of agreements returned successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgreementDTO"
        "500":
          description: Unexpected server error
    post:
      tags:
      - Agreements
      summary: Create an agreement
      description: Proposes a new commercial agreement.
      operationId: createAgreement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgreementDTO"
        required: true
      responses:
        "201":
          description: Agreement created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AgreementDTO"
        "400":
          description: Validation failed
  /api/v1/sustainability/calculate-impact:
    get:
      tags:
      - Sustainability
      summary: Calculate estimated CO2 impact
      description: Calculates the CO2 reduction in Kg based on material quantity and
        category.
      operationId: calculateImpact
      parameters:
      - name: quantity
        in: query
        description: Quantity of material
        required: true
        schema:
          type: number
          format: double
        example: 500
      - name: category
        in: query
        description: Waste category
        required: true
        schema:
          type: string
        example: METAL_WASTE
      responses:
        "200":
          description: Calculation successful
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/v1/messages/{id}:
    get:
      tags:
      - Messages
      summary: Get message by ID
      description: Retrieves the detail of a single message.
      operationId: getMessageById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Message found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageDTO"
        "404":
          description: Message not found
        "500":
          description: Unexpected server error
    delete:
      tags:
      - Messages
      summary: Delete a message
      description: Permanently removes a message.
      operationId: deleteMessage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Message deleted successfully
        "404":
          description: Message not found
  /api/v1/matches/demands/{demandId}:
    get:
      tags:
      - Smart Matching
      summary: Find optimal matches for a demand
      description: "Executes the heuristics engine to calculate compatibility scores\
        \ between a specific demand and the active market supply, returning the top\
        \ 5 results sorted by score."
      operationId: getBestMatches
      parameters:
      - name: demandId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Match results successfully calculated
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchResultDTO"
  /api/v1/companies:
    get:
      tags:
      - Companies
      summary: List all companies (paginated)
      description: "Returns a paginated, sorted list of all registered companies.\
        \ Sensitive fields (password, logo bytes, roles) are excluded from the response."
      operationId: getAllCompanies
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "id,DESC"
          items:
            type: string
      responses:
        "200":
          description: Page of companies returned successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CompanyDTO"
        "500":
          description: Unexpected server error
  /api/v1/charts/impact:
    get:
      tags:
      - Dashboard
      summary: Get global impact statistics
      description: Returns structured chart data arrays for platform-wide distributions.
      operationId: getImpactChartData
      responses:
        "200":
          description: Data successfully fetched
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChartDataDTO"
components:
  schemas:
    CompanyDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        commercialName:
          type: string
          minLength: 1
        contactEmail:
          type: string
          minLength: 1
        taxId:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        industrialSector:
          type: string
          minLength: 1
        description:
          type: string
          maxLength: 255
          minLength: 0
        role:
          type: string
        co2Saved:
          type: number
          format: double
        ranking:
          type: integer
          format: int32
        sector:
          type: string
        verified:
          type: boolean
        initial:
          type: string
        formattedCo2Saved:
          type: string
      required:
      - address
      - commercialName
      - contactEmail
      - description
      - industrialSector
      - phone
      - taxId
    OfferDTO:
      type: object
      properties:
        id:
