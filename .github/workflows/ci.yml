name: EcoMostoles CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build and Test EcoMostoles
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar Java 21 y caché de Maven
      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Dar permisos de ejecución a los wrappers de Maven (Linux runner)
      - name: Grant Execute Permissions for Maven Wrappers
        run: chmod +x app-service/mvnw utility-service/mvnw

      # 4. Compilar y ejecutar tests de App Service
      - name: Run Tests (app-service)
        run: |
          cd app-service
          ./mvnw clean test
